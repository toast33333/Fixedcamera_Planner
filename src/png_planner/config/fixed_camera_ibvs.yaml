# Visual interface (unchanged from the existing controller)
detection_mode: 0
detection_topic: /object_kcf
minimum_detection_score: 0.0
bbox_center_is_offset: true
y_up_positive: true

# Camera intrinsics
fx: 640.0
fy: 640.0
cx: 480.0
cy: 270.0

# Fixed camera installation correction relative to a forward-looking mount.
# ROS body frame is FLU: +x forward, +y left, +z up. Camera optical frame is
# +z forward, +x right, +y down. A negative body-y pitch raises the optical axis.
camera_mount_roll_deg: 0.0
camera_mount_pitch_deg: -20.0
camera_mount_yaw_deg: 0.0
desired_u_offset_px: 0.0
desired_v_offset_px: 0.0

# Existing velocity-controller interface
pose_topic: /mavros/local_position/pose
attitude_topic: /mavros/imu/data
velocity_topic: /mavros/local_position/velocity_local
command_topic: /mavros/setpoint_velocity/cmd_vel
V_default: 5.0
lost_forward_speed: 5.0
# The approach node can provide the target-speed-based forward speed at handover.
# Disabled in the standalone launch, enabled by radar_approach_intercept.launch.
enable_forward_speed_topic: false
forward_speed_topic: /fixed_camera_ibvs/forward_speed_setpoint
min_forward_speed: 1.0
max_forward_speed: 12.0
forward_speed_smoothing_alpha: 0.25
N_nav: 2.0
max_lateral_velocity: 2.0
k_yaw: 1.5
k_yaw_d: 0.3
max_yaw_rate: 1.0
yaw_enable_speed_ratio: 0.4

# Vertical channel
enable_height_control: true
k_z_ff: 1.0
N_nav_z: 2.0
max_vz: 1.0
vertical_integrator_decay: 0.98

# Paper-style half-angle FOV constraints. These are the measured usable viewing
# ranges of the test interceptor: horizontal +/-26.6 deg, vertical +/-20.6 deg.
# The corresponding full FOV is 53.2 x 41.2 deg.
# With fx=fy=640, these equal about +/-320.5 px and +/-240.6 px.
fov_horizontal_limit_deg: 26.6
fov_vertical_limit_deg: 20.6
fov_barrier_gain: 0.20
fov_barrier_max: 4.0
fov_slowdown_start_ratio: 0.65
fov_min_forward_speed_ratio: 0.25
fov_emergency_yaw_ratio: 0.85

# Attitude and image-delay compensation
enable_attitude_compensation: true
image_delay_sec: 0.08
max_los_prediction_sec: 0.25
pose_history_sec: 1.0
lost_timeout: 0.30
control_rate: 50.0
use_real_dt: true
step_dt: 0.02
pixel_thr: 5.0
pixel_thr_y: 5.0

# Inertial LOS azimuth/elevation filters
lambda_kalman_q_position: 0.0001
lambda_kalman_q_rate: 0.5
lambda_kalman_r: 0.0002
gamma_kalman_q_position: 0.0001
gamma_kalman_q_rate: 0.5
gamma_kalman_r: 0.0002

# Optional diagnostics (Vector3Stamped)
# los_world: x/y/z unit LOS in the MAVROS local frame
# fov_state: x=horizontal ratio, y=vertical ratio, z=barrier scale
los_debug_topic: /fixed_camera_ibvs/los_world
fov_debug_topic: /fixed_camera_ibvs/fov_state
