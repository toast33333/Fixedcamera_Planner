# Timestamped visual input. Detection.header.stamp is the camera acquisition
# time and is used to interpolate the matching IMU attitude.
detection_mode: 1
detection_topic: /object_detections
minimum_detection_score: 0.0
bbox_center_is_offset: true
y_up_positive: true

# Camera intrinsics
fx: 640.0
fy: 640.0
cx: 480.0
cy: 270.0

# Fixed camera installation correction relative to a forward-looking mount.
# ROS body frame is FLU: +x forward, +y left, +z up. Camera optical frame is
# +z forward, +x right, +y down. A negative body-y pitch raises the optical axis.
camera_mount_roll_deg: 0.0
camera_mount_pitch_deg: -20.0
camera_mount_yaw_deg: 0.0
desired_u_offset_px: 0.0
desired_v_offset_px: 0.0

# Optional single-axis camera pitch servo. It is disabled until the real
# PWM/serial adapter is available, so the current fixed-camera behaviour is
# unchanged. Both command and feedback are angles relative to the mechanical
# neutral position in degrees; positive means that the camera looks farther up.
enable_camera_pitch_servo: false
camera_pitch_servo_command_topic: /camera_pitch_servo/command_deg
camera_pitch_servo_feedback_topic: /camera_pitch_servo/feedback_deg
camera_pitch_servo_state_topic: /fixed_camera_ibvs/camera_pitch_servo_state
camera_pitch_servo_use_feedback: false
camera_pitch_servo_feedback_timeout_sec: 0.20
camera_pitch_servo_initialize_from_feedback: true
camera_pitch_servo_neutral_deg: 0.0
camera_pitch_servo_min_deg: -25.0
camera_pitch_servo_max_deg: 25.0
camera_pitch_servo_kp_per_sec: 3.0
camera_pitch_servo_ki_per_sec2: 0.0
camera_pitch_servo_kd: 0.05
camera_pitch_servo_integral_limit_deg_sec: 10.0
camera_pitch_servo_derivative_alpha: 0.2
camera_pitch_servo_integral_decay: 0.98
camera_pitch_servo_deadband_deg: 0.4
camera_pitch_servo_max_rate_degps: 60.0
camera_pitch_servo_return_on_loss: true
camera_pitch_servo_return_rate_degps: 20.0

# Existing velocity-controller interface
pose_topic: /mavros/local_position/pose
attitude_topic: /mavros/imu/data
velocity_topic: /mavros/local_position/velocity_local
command_topic: /mavros/setpoint_velocity/cmd_vel
V_default: 5.0
lost_forward_speed: 5.0
# The approach node can provide the target-speed-based forward speed at handover.
# Disabled in the standalone launch, enabled by radar_approach_intercept.launch.
enable_forward_speed_topic: false
forward_speed_topic: /fixed_camera_ibvs/forward_speed_setpoint
min_forward_speed: 1.0
max_forward_speed: 20.0
forward_speed_smoothing_alpha: 0.25
# Simulation-selected starting value for direct visual interception. Validate
# the same acceleration limit on the real airframe before field deployment.
forward_speed_accel_limit_mps2: 1.5
# Horizontal LOS error is corrected by yaw only. The former horizontal PN
# body-left velocity output has been removed from fixed_camera_ibvs.
k_yaw: 1.5
k_yaw_d: 0.3
max_yaw_rate: 1.0
yaw_enable_speed_ratio: 0.1

# Vertical channel
enable_height_control: true
k_z_ff: 1.0
N_nav_z: 2.0
max_vz: 2.0
vertical_integrator_decay: 0.98

# The measured physical half-FOV is horizontal +/-26.6 deg and vertical
# +/-20.6 deg. Use 90% of it as the controller's warning envelope.
fov_horizontal_limit_deg: 23.94
fov_vertical_limit_deg: 18.54
# The base interception equations are untouched inside the central 50% of the
# usable image area. Outside it, an independent bounded barrier-gradient term
# is added to yaw rate and vertical speed; it never multiplies the base gains.
fov_guard_center_area_ratio: 0.50
# These gains affect only the extra guard terms; they do not change k_yaw,
# k_yaw_d, k_z_ff or N_nav_z. The channels are separate because their units
# differ: rad/s for yaw rate and m/s for vertical speed.
fov_guard_yaw_gain_radps: 0.20
fov_guard_vertical_gain_mps: 0.20
fov_guard_shape_max: 4.0
# Keep forward closing speed unchanged. The FOV term corrects yaw and vertical
# motion but does not slow the interceptor, which avoids delaying interception.
fov_slowdown_start_ratio: 0.99
fov_min_forward_speed_ratio: 1.0
fov_emergency_yaw_ratio: 0.85

# Attitude and image-delay compensation
enable_attitude_compensation: true
# Use only the timestamped IMU orientation history for visual/attitude alignment.
use_pose_orientation: false
# Optional estimator-health gate. The original PX4-state launch keeps this
# disabled; the INSLIB launch overrides it to true and stops on stale/invalid
# navigation state instead of continuing with an old attitude.
enable_state_valid_topic: false
state_valid_topic: /inslib/state_valid
state_valid_timeout_sec: 0.15
max_los_prediction_sec: 0.25
pose_history_sec: 1.0
lost_timeout: 0.30
control_rate: 50.0
use_real_dt: true
step_dt: 0.02
pixel_thr: 5.0
pixel_thr_y: 5.0

# Inertial LOS azimuth/elevation filters
lambda_kalman_q_position: 0.0001
lambda_kalman_q_rate: 0.5
lambda_kalman_r: 0.0002
gamma_kalman_q_position: 0.0001
gamma_kalman_q_rate: 0.5
gamma_kalman_r: 0.0002

# Optional diagnostics (Vector3Stamped)
# los_world: x/y/z unit LOS in the MAVROS local frame
# fov_state: x=horizontal ratio, y=vertical ratio, z=max dimensionless guard shape
los_debug_topic: /fixed_camera_ibvs/los_world
fov_debug_topic: /fixed_camera_ibvs/fov_state
nominal_command_debug_topic: /fixed_camera_ibvs/nominal_pn_cmd
fov_correction_debug_topic: /fixed_camera_ibvs/fov_correction
